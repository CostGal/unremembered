<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>card</title>
<style>
  @font-face { font-family: "Play"; src: url("fonts/Play-Regular-latin.woff2") format("woff2"); }
  html, body { margin: 0; width: 1080px; height: 1920px; background: #0b0d14; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "Play", sans-serif; color: #f1efe8; text-align: center; }
  .logo { width: 900px; image-rendering: pixelated; margin-bottom: 110px; }
  .line { font-size: 64px; line-height: 1.5; letter-spacing: 1px; margin: 0 60px; }
  .line.accent { color: #3fd0c9; }
  .line.small { font-size: 40px; color: #8a8fa3; margin-top: 90px; }
  .motes { position: absolute; inset: 0; pointer-events: none; }
  .mote { position: absolute; width: 6px; height: 6px; background: #3fd0c9; opacity: 0.7; }
</style>
</head>
<body>
  <div class="motes" id="motes"></div>
  <!--LOGO-->
  <!--LINES-->
  <script>
    // A few still teal motes, like the title screen's.
    const m = document.getElementById('motes');
    let s = 7;
    const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
    for (let i = 0; i < 18; i++) {
      const d = document.createElement('div');
      d.className = 'mote';
      d.style.left = `${60 + rnd() * 960}px`;
      d.style.top = `${200 + rnd() * 1500}px`;
      d.style.opacity = 0.25 + rnd() * 0.5;
      m.appendChild(d);
    }
  </script>
</body>
</html>
