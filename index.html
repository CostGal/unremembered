<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Unremembered</title>
    <!-- The font is needed before the first screen: fetch it alongside the JS. -->
    <link rel="preload" href="./fonts/PixelifySans-Regular-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Pixelify Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/PixelifySans-Regular-latin.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        background: #0b0d14;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0b0d14;
        color: #f1efe8;
        font: 20px 'Pixelify Sans', monospace;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      /* Phones held sideways (short landscape screens); desktops are unaffected. */
      @media (orientation: landscape) and (max-height: 500px) {
        #rotate {
          display: flex;
        }
      }
      canvas {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Rotate your phone</div>
    <script>
      document.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
