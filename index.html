<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Unremembered</title>
    <!-- Installable (Add to Home Screen) and full screen when launched from there. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0b0d14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Unremembered" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <!-- The font is needed before the first screen: fetch it alongside the JS. -->
    <link rel="preload" href="./fonts/Play-Regular-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Play: the game font (English and Greek). */
      @font-face {
        font-family: 'Play';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/Play-Regular-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Play';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/Play-Regular-greek.woff2') format('woff2');
        unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;
      }
      @font-face {
        font-family: 'Pixelify Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/PixelifySans-Regular-latin.woff2') format('woff2');
      }
      /* Optional UI fonts (Settings > Font) with Greek glyphs; fetched only when chosen. */
      @font-face {
        font-family: 'Handjet';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/Handjet-Regular-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Handjet';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/Handjet-Regular-greek.woff2') format('woff2');
        unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;
      }
      /* "Handjet UI": Handjet's letters (Latin + Greek) with Pixelify Sans digits and
         number signs (Handjet's small 0 reads as an 8 at HUD sizes). The last face that
         covers a character wins, so the digits face comes after the Handjet ones. */
      @font-face {
        font-family: 'Handjet UI';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/Handjet-Regular-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Handjet UI';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/Handjet-Regular-greek.woff2') format('woff2');
        unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;
      }
      @font-face {
        font-family: 'Handjet UI';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/PixelifySans-Regular-latin.woff2') format('woff2');
        unicode-range: U+0025, U+002B, U+002F, U+0030-0039;
      }
      @font-face {
        font-family: 'Tiny5';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/Tiny5-Regular-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Tiny5';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/Tiny5-Regular-greek.woff2') format('woff2');
        unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh; /* older iOS (< 15.4) ignores this and keeps 100% */
        background: #0b0d14;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      /* Fixed: no rubber-band scroll or pull-to-refresh under the Instagram toolbars. */
      body {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        /* viewport-fit=cover draws under the notch / home bar: keep the game clear of them. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0b0d14;
        color: #f1efe8;
        font: 20px 'Play', sans-serif;
        align-items: center;
        justify-content: center;
        text-align: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Phones held sideways (short landscape screens); desktops are unaffected. */
      @media (orientation: landscape) and (max-height: 500px) {
        #rotate {
          display: flex;
        }
      }
      canvas {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Rotate your phone</div>
    <script>
      // Long-press callout, text selection, image drag and iOS pinch gestures.
      ['contextmenu', 'selectstart', 'dragstart', 'gesturestart', 'gesturechange', 'gestureend'].forEach((type) =>
        document.addEventListener(type, (e) => e.preventDefault(), { passive: false })
      );
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
